name: Validera

# Körs vid varje push och pull request. Skyddsregeln på main kräver att jobbet "validera" går igenom.
on:
  push:
  pull_request:

jobs:
  validera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hela historiken, för jämförelsen med föregående version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testa skripten
        run: python -m unittest discover scripts

      - name: Validera begrepp.json
        env:
          # Pull request: jämför med main. Push: jämför med commiten före pushen.
          FOREGAENDE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -n "$FOREGAENDE" ] && [ "$FOREGAENDE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/validera.py begrepp.json --foregaende "$FOREGAENDE"
          else
            python scripts/validera.py begrepp.json
          fi
